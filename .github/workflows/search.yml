name: Flight search

on:
  workflow_dispatch:
    inputs:
      trip:
        description: "mexico, malaysia or all"
        default: all
  schedule:
    - cron: "17 7 * * *" # daily, ~07:17 UTC

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m flights_tracker --trip "${{ inputs.trip || 'all' }}"
      - name: Show report
        run: cat results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "flights-bot"
          git config user.email "flights-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Flight search results $(date -u +%F)"
          git push
